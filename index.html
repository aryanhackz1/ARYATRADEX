<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARYATRADEX · launch</title>
  <!-- Font Awesome (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- Google Font: Style Script (fancy cursive) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&family=Style+Script&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: #0b0d10;
      position: relative;
      overflow-x: hidden;
    }

    /* ---------- GIF BACKGROUND ---------- */
    .gif-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.55) saturate(1.2);
      pointer-events: none;
    }

    .gif-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
      pointer-events: none;
    }

    /* ---------- CARD ---------- */
    .launch-card {
      position: relative;
      z-index: 2;
      max-width: 500px;
      width: 100%;
      background: rgba(12, 16, 22, 0.65);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border-radius: 3.5rem;
      padding: 2.2rem 2rem 2.8rem;
      box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: box-shadow 0.3s ease;
      text-align: center;
    }

    .logo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.8rem;
    }

    .logo-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.7));
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.2);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.02);
      padding: 6px;
    }

    .logo-img:hover {
      transform: scale(1.04) rotate(2deg);
    }

    .brand-name {
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f0e9e0 0%, #c0b7a8 80%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-top: 0.25rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      position: relative;
      font-family: 'Inter', sans-serif;
    }

    .brand-name::after {
      content: '';
      position: absolute;
      width: 50px;
      height: 3px;
      background: linear-gradient(90deg, #f7b731, #f5a623);
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 20px;
      opacity: 0.7;
    }

    .action-grid {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      margin-top: 2.8rem;
    }

    .action-card {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      background: rgba(28, 33, 42, 0.8);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 1.2rem 1.8rem;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.7);
      transition: all 0.25s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }

    .action-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 80% 20%, rgba(255, 215, 0, 0.02), transparent 70%);
      pointer-events: none;
    }

    .action-card:hover {
      transform: translateY(-5px) scale(1.01);
      background: rgba(38, 44, 56, 0.9);
      border-color: rgba(255, 215, 0, 0.15);
      box-shadow: 0 16px 30px -8px #000000cc, 0 0 0 1px rgba(255, 215, 0, 0.05);
    }

    .action-card:active {
      transform: scale(0.97);
      transition-duration: 0.06s;
    }

    .card-icon {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.03);
      padding: 6px;
      background: #13181f;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.6);
    }

    .card-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 20px;
      filter: drop-shadow(0 4px 6px #00000055);
      transition: transform 0.2s;
    }

    .action-card:hover .card-icon img {
      transform: scale(1.04);
    }

    .card-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      flex: 1;
    }

    /* ---- FANCY SCRIPT FONT ---- */
    .card-title {
      font-family: 'Style Script', cursive;
      font-size: 1.9rem;
      font-weight: 400;
      color: #f5ede0;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      line-height: 1.1;
      margin-bottom: 2px;
      transition: 0.2s;
    }

    .action-card:hover .card-title {
      color: #fff5e6;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.15);
    }

    .card-sub {
      font-size: 0.72rem;
      font-weight: 400;
      color: #b8b0c0;
      letter-spacing: 0.04em;
      opacity: 0.8;
      margin-top: 0px;
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
    }

    .card-arrow {
      color: #5f5a6b;
      font-size: 1.2rem;
      opacity: 0.5;
      transition: all 0.2s;
      margin-left: 0.2rem;
    }

    .action-card:hover .card-arrow {
      color: #f5c542;
      opacity: 1;
      transform: translateX(5px);
    }

    .telegram-card .card-icon {
      background: #1f2a36;
    }

    .telegram-card .card-title {
      color: #d0e0ff;
    }

    .telegram-card:hover {
      border-color: rgba(0, 136, 204, 0.25);
      box-shadow: 0 16px 30px -8px #000000cc, 0 0 0 1px rgba(0, 136, 204, 0.1);
    }

    .website-card .card-icon {
      background: #1f2a2a;
    }

    .website-card .card-title {
      color: #f5e7c8;
    }

    .website-card:hover {
      border-color: rgba(255, 180, 50, 0.2);
      box-shadow: 0 16px 30px -8px #000000cc, 0 0 0 1px rgba(255, 180, 50, 0.08);
    }

    .footer-note {
      margin-top: 2.2rem;
      font-size: 0.7rem;
      color: #484f5a;
      letter-spacing: 0.05em;
      border-top: 1px solid rgba(255, 255, 255, 0.02);
      padding-top: 1.2rem;
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .footer-note span {
      opacity: 0.3;
      font-weight: 300;
    }

    @media (max-width: 480px) {
      .launch-card {
        padding: 1.8rem 1.2rem 2rem;
        border-radius: 2.5rem;
      }
      .brand-name {
        font-size: 2.2rem;
      }
      .logo-img {
        width: 80px;
        height: 80px;
      }
      .action-card {
        padding: 1rem 1.4rem;
        gap: 0.9rem;
      }
      .card-icon {
        width: 50px;
        height: 50px;
      }
      .card-title {
        font-size: 1.6rem;
      }
    }

    .action-card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.01), transparent 70%);
      pointer-events: none;
      transition: 0.6s;
    }

    .action-card:hover::after {
      opacity: 0.3;
    }
  </style>
</head>
<body>

  <!-- GIF BACKGROUND - Auto-play hoti hai by default -->

  <div class="gif-overlay"></div>

  </div>

  <!-- Simple JS -->
  <script>
    (function() {
      // Enforce _blank on cards
      const cards = document.querySelectorAll('.action-card');
      cards.forEach(card => {
        if (card.href) {
          card.setAttribute('target', '_blank');
          card.setAttribute('rel', 'noopener noreferrer');
        }
      });
    })();
  </script>
</body>
</html>
